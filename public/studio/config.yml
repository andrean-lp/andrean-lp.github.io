backend:
  name: github
  repo: andrean-lp/andrean-lp.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    nested:
      depth: 2
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Artikel (H1 & SEO Title)", name: "title", widget: "string", hint: "Judul utama artikel. Otomatis menjadi heading H1 serta terhubung langsung ke SEO (Google & Pratinjau Sosial Media)." }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Pilih dari daftar rekomendasi di bawah, atau ketik langsung di kolom untuk membuat tag baru." }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Ukuran maksimal 1 MB (otomatis WebP). Saat artikel dihapus, file gambarnya akan otomatis ikut terhapus dari server." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects_collection"
    label: "Client Projects"
    files:
      - label: "Daftar Client Projects"
        name: "all_projects"
        file: "src/data/projects.json"
        fields:
          - label: "Daftar Proyek"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Nama Project", name: "name", widget: "string" }
              - { label: "Deskripsi Singkat", name: "description", widget: "string" }
              - { label: "Link Details (Tombol Putih)", name: "postLink", widget: "string", required: false, hint: "Tautan ke artikel/studi kasus/detail proyek. Jika dikosongkan, tombol otomatis mengarah ke Live Preview." }
              - { label: "Link Live Preview / Demo (Tombol Hitam)", name: "demoLink", widget: "string", required: false, hint: "Tautan website live atau aplikasi" }
              - { label: "Tags / Kategori", name: "tags", widget: "list", required: false }

  - name: "side_projects_collection"
    label: "Side Project (Homepage)"
    files:
      - label: "Pengaturan Side Project"
        name: "featured_case_study"
        file: "src/data/featured_case_study.json"
        fields:
          - { label: "Tampilkan di Homepage?", name: "show", widget: "boolean", default: true }
          - { label: "Judul Section", name: "sectionTitle", widget: "string", default: "Side Project" }
          - label: "Daftar Project"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Judul Project", name: "title", widget: "string" }
              - { label: "Slug URL (Halaman Detail)", name: "slug", widget: "string", hint: "Contoh: storiq. Menentukan alamat URL detail: /side-projects/storiq/" }
              - { label: "Kategori Proyek", name: "category", widget: "string", required: false, hint: "Contoh: Portfolio & CMS Platform atau Learning Management System" }
              - { label: "Tagline / Slogan", name: "tagline", widget: "string", required: false, hint: "Kalimat ringkas di bawah judul" }
              - { label: "Tipe Proyek", name: "type", widget: "string", default: "Side Project", required: false, hint: "Contoh: Side Project, Web Application, SaaS" }
              - { label: "Gambar Cover / Mockup", name: "coverImage", widget: "image", required: false, hint: "Upload gambar cover / mockup showcase proyek" }
              - { label: "Link Live Preview (Tombol Hitam / Lihat Website)", name: "previewLink", widget: "string", required: false, hint: "Link website live, contoh: https://domain-project.com" }
              - { label: "Custom Link Details", name: "detailsLink", widget: "string", required: false, hint: "Kosongkan untuk otomatis menggunakan /side-projects/[slug]/" }
              - { label: "Tentang Proyek (About)", name: "about", widget: "markdown", required: false, hint: "Deskripsi umum tentang proyek" }
              - { label: "Tantangan (Problem)", name: "problem", widget: "markdown", required: false }
              - { label: "Solusi (Solution)", name: "solution", widget: "markdown", required: false }
              - { label: "Fitur Utama (Key Features)", name: "features", widget: "list", required: false, hint: "Daftar fitur unggulan. Contoh: **Real-time Sync** — sinkronisasi data instan" }
              - { label: "Hasil (Impact)", name: "impact", widget: "markdown", required: false }
              - { label: "Deskripsi Tech Stack", name: "techStackDescription", widget: "markdown", required: false, hint: "Penjelasan mendalam mengapa teknologi tersebut dipilih" }
              - { label: "Technologies / Tools", name: "technologies", widget: "list", required: false }

  - name: "testimonials_collection"
    label: "Testimoni & Review"
    files:
      - label: "Daftar Testimoni Klien"
        name: "testimonials_data"
        file: "src/data/testimonials.json"
        fields:
          - { label: "Judul Halaman", name: "pageTitle", widget: "string", default: "Kisah Sukses & Hasil Nyata" }
          - { label: "Badge Atas Halaman", name: "pageBadge", widget: "string", default: "Bukti / Testimoni", required: false }
          - { label: "Sub-judul / Deskripsi Halaman", name: "pageSubtitle", widget: "string", default: "Bukan saya yang bilang tapi mereka 😊" }
          - label: "Daftar Testimoni"
            name: "items"
            widget: "list"
            summary: "{{fields.clientName}} ({{fields.category}})"
            fields:
              - { label: "Nama Klien / User", name: "clientName", widget: "string", required: false, hint: "Contoh: Rian Pratama atau Nama Perusahaan" }
              - { label: "Role / Nama Bisnis", name: "roleOrCompany", widget: "string", required: false, hint: "Contoh: Founder Brand Skincare / CEO PT Maju" }
              - { label: "Kategori Testimoni", name: "category", widget: "select", options: ["WhatsApp", "Google Review", "Diskusi Client", "Hasil Konversi", "Lainnya"], default: "WhatsApp", hint: "Kategori untuk filter tab di halaman testimoni" }
              - { label: "Gambar Bukti Testimoni", name: "image", widget: "image", hint: "Upload screenshot WhatsApp, foto review Google, foto diskusi, atau grafik hasil. Otomatis dikompres & dikonversi ke WebP." }
              - { label: "Tanggal", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }

  - name: "digital_products_collection"
    label: "Digital Products"
    files:
      - label: "Pengaturan Digital Products"
        name: "digital_products_data"
        file: "src/data/digital_products.json"
        fields:
          - { label: "Tampilkan di Homepage?", name: "show", widget: "boolean", default: true }
          - { label: "Judul Section", name: "sectionTitle", widget: "string", default: "Digital Products" }
          - { label: "Sub-judul / Deskripsi Section", name: "sectionSubtitle", widget: "string", default: "Tools, template, dan panduan praktis untuk mendongkrak konversi bisnis Anda.", required: false }
          - { label: "Teks Tombol Kanan Atas", name: "sectionCtaText", widget: "string", default: "All Products", required: false, hint: "Teks tombol kecil di samping kanan judul section" }
          - { label: "Link Tombol Kanan Atas", name: "sectionCtaUrl", widget: "string", default: "https://clicky.id/andrean-lp", required: false, hint: "Link tujuan saat tombol kanan atas diklik (contoh: https://clicky.id/andrean-lp)" }
          - label: "Daftar Produk Digital"
            name: "products"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID Produk", name: "id", widget: "string", required: false }
              - { label: "Nama Produk Digital", name: "title", widget: "string" }
              - { label: "Badge / Kategori", name: "badge", widget: "string", required: false, hint: "Contoh: Notion & PDF, Template, Source Code, E-Book" }
              - { label: "Deskripsi Produk", name: "description", widget: "text", hint: "Penjelasan ringkas manfaat dan value produk" }
              - { label: "Gambar Mockup / Cover", name: "image", widget: "image", required: false, hint: "Upload cover produk (otomatis dikompres ke WebP)" }
              - { label: "Link Tombol (URL Checkout / WA / Download)", name: "buyUrl", widget: "string", hint: "Link tujuan saat tombol diklik. Bebas diisi link checkout Lynk.id, Mayar, Shopee, Gumroad, link WhatsApp (https://wa.me/...), atau web lainnya." }
              - { label: "Tulisan Tombol", name: "ctaText", widget: "string", default: "Buy Now", required: false, hint: "Teks pada tombol (bawaan: Buy Now. Bisa diubah bebas per produk)." }

  - name: "faq_collection"
    label: "FAQ / Tanya Jawab"
    files:
      - label: "FAQ Homepage"
        name: "faq_data"
        file: "src/data/faq.json"
        fields:
          - { label: "Tampilkan FAQ di Homepage?", name: "show", widget: "boolean", default: true }
          - { label: "Judul Utama FAQ", name: "title", widget: "string", default: "Got Questions? We've Got Answers." }
          - { label: "Sub-judul / Deskripsi", name: "subtitle", widget: "string", default: "Hal yang paling sering ditanyakan seputar strategi landing page, optimasi konversi, dan alur kerja sama." }
          - label: "Daftar Pertanyaan & Jawaban"
            name: "items"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Pertanyaan", name: "question", widget: "string" }
              - { label: "Jawaban", name: "answer", widget: "markdown", hint: "Mendukung teks tebal, tautan link, dan format paragraf." }

  - name: "about_collection"
    label: "Halaman Tentang (About)"
    files:
      - label: "Konten Halaman About"
        name: "about_page"
        file: "src/data/about.json"
        fields:
          - { label: "Judul Halaman", name: "title", widget: "string", default: "Tentang Saya" }
          - { label: "Deskripsi Singkat (Samping Foto)", name: "shortDesc", widget: "markdown", hint: "Muncul di samping foto. Kosongkan jika tidak perlu.", required: false }
          - { label: "Konten Utama (Bawah Foto)", name: "content", widget: "markdown", hint: "Cerita lengkap Anda. Mendukung gambar, link, dan format paragraf.", required: false }

  - name: "profile_collection"
    label: "Profil & Biodata"
    files:
      - label: "Biodata & Foto Profil"
        name: "profile_data"
        file: "src/data/profile.json"
        fields:
          - { label: "Nama Lengkap", name: "name", widget: "string" }
          - { label: "Headline / Sapaan", name: "headline", widget: "string", hint: "Contoh: Halo! Saya Andre Wahyu Hermawan 👋" }
          - { label: "Role / Profesi", name: "role", widget: "string", hint: "Contoh: Landing Page Strategist" }
          - { label: "Bio / Paragraf Perkenalan", name: "bio", widget: "markdown", hint: "Tuliskan pengenalan diri Anda. Bisa ditambahkan link, format paragraf, dll." }
          - { label: "Foto Profil (Avatar)", name: "avatar", widget: "image", required: false, hint: "Disarankan upload gambar rasio 1:1 minimal 600x600 px (otomatis WebP). Saat diganti baru, foto profil lama otomatis ikut terhapus dari server." }
          - { label: "Link Website", name: "website", widget: "string", required: false }
          - { label: "Link GitHub (Ikon Header & Profil)", name: "github", widget: "string", required: false, hint: "Link profil GitHub Anda, contoh: https://github.com/andrean-lp. Otomatis terpasang pada ikon GitHub di pojok kanan atas." }
          - { label: "Link YouTube (Ikon Footer)", name: "youtube", widget: "string", required: false, hint: "Contoh: https://youtube.com/@username" }
          - { label: "Link Instagram (Ikon Footer)", name: "instagram", widget: "string", required: false, hint: "Contoh: https://instagram.com/username" }
          - { label: "Link Facebook (Ikon Footer)", name: "facebook", widget: "string", required: false, hint: "Contoh: https://facebook.com/username" }
          - { label: "Link LinkedIn (Ikon Footer)", name: "linkedin", widget: "string", required: false, hint: "Contoh: https://linkedin.com/in/username" }
          - { label: "Link Pinterest (Ikon Footer)", name: "pinterest", widget: "string", required: false, hint: "Contoh: https://pinterest.com/username" }

  - name: "settings_collection"
    label: "Pengaturan Website"
    files:
      - label: "Judul, Favicon & Footer"
        name: "site_settings"
        file: "src/data/site.json"
        fields:
          - { label: "Judul Website (Site Title)", name: "title", widget: "string", hint: "Judul utama website yang muncul pada tab browser (contoh: Andre Wahyu Hermawan)" }
          - { label: "Tagline / Sub-judul", name: "tagline", widget: "string", required: false, hint: "Slogan yang muncul di samping judul pada tab browser (contoh: Landing Page Strategist)" }
          - { label: "Deskripsi Website (SEO)", name: "description", widget: "string", required: false, hint: "Deskripsi website untuk Google, mesin pencari, dan pratinjau link" }
          - { label: "Favicon (Ikon Tab Browser)", name: "favicon", widget: "image", required: false, hint: "Upload ikon tab browser (.png, .ico, atau .webp). Saat diganti dengan gambar baru, file favicon yang lama akan otomatis ikut terhapus dari server." }
          - { label: "Teks Footer", name: "footer", widget: "string", required: false, hint: "Teks di bagian footer website. Mendukung format link [Nama Link](https://url). Gunakan {year} untuk otomatis menampilkan tahun saat ini." }
          - { label: "Link Telegram (Tombol Melayang)", name: "telegram", widget: "string", default: "https://t.me/andrean_lp", required: false, hint: "Link Telegram tujuan saat popup form disubmit (contoh: https://t.me/andrean_lp)." }
          - { label: "Google Apps Script Webhook URL (Leads to Spreadsheet & Bot)", name: "leadWebhookUrl", widget: "string", required: false, hint: "URL Webhook Google Apps Script untuk menyimpan data Nama, Email, WhatsApp ke Google Spreadsheet & notifikasi Bot Telegram." }

      - label: "Primary Color (Warna Utama Website)"
        name: "theme_settings"
        file: "src/data/theme.json"
        fields:
          - { label: "Kode Warna Primary (RGB / HEX)", name: "primaryColor", widget: "string", default: "rgb(37, 99, 235)", hint: "Masukkan kode warna RGB (contoh: rgb(37, 99, 235) atau 37, 99, 235) atau kode HEX (contoh: #2563eb). Nilai ini otomatis tersambung ke variabel CSS frontend (:root { --primary-color: ...; --primary-rgb: ...; })." }