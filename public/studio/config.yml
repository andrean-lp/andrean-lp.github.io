backend:
  name: github
  repo: andrean-lp/andrean-lp.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    nested:
      depth: 2
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Ukuran maksimal 1 MB (otomatis dikonversi ke WebP)" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects_collection"
    label: "Projects"
    files:
      - label: "Daftar Projects"
        name: "all_projects"
        file: "src/pages/projects/projects.json"
        fields:
          - label: "Daftar Proyek"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Demo Link", name: "demoLink", widget: "string", required: false }
              - { label: "Post Link", name: "postLink", widget: "string", required: false }
              - { label: "Tags", name: "tags", widget: "list", required: false }

  - name: "profile_collection"
    label: "Profil & Biodata"
    files:
      - label: "Biodata & Foto Profil"
        name: "profile_data"
        file: "src/data/profile.json"
        fields:
          - { label: "Nama Lengkap", name: "name", widget: "string" }
          - { label: "Headline / Sapaan", name: "headline", widget: "string", hint: "Contoh: Hi There 👋, Syakir Here!" }
          - { label: "Role / Profesi", name: "role", widget: "string", hint: "Contoh: Front-end Engineer" }
          - { label: "Bio / Paragraf Perkenalan", name: "bio", widget: "markdown", hint: "Tuliskan pengenalan diri Anda. Bisa ditambahkan link, format paragraf, dll." }
          - { label: "Foto Profil (Avatar)", name: "avatar", widget: "image", required: false, hint: "Disarankan upload gambar rasio 1:1 (kotak) minimal 600x600 px. Ukuran maksimal 1 MB (otomatis dikonversi ke WebP)" }
          - { label: "Link Twitter / X", name: "twitter", widget: "string", required: false }
          - { label: "Link Website", name: "website", widget: "string", required: false }
          - { label: "Link GitHub (Ikon Header & Profil)", name: "github", widget: "string", required: false, hint: "Link profil GitHub Anda, contoh: https://github.com/andrean-lp. Otomatis terpasang pada ikon GitHub di pojok kanan atas." }
          - { label: "Link YouTube (Ikon Footer)", name: "youtube", widget: "string", required: false, hint: "Contoh: https://youtube.com/@username" }
          - { label: "Link Instagram (Ikon Footer)", name: "instagram", widget: "string", required: false, hint: "Contoh: https://instagram.com/username" }
          - { label: "Link Facebook (Ikon Footer)", name: "facebook", widget: "string", required: false, hint: "Contoh: https://facebook.com/username" }
          - { label: "Link LinkedIn (Ikon Footer)", name: "linkedin", widget: "string", required: false, hint: "Contoh: https://linkedin.com/in/username" }
          - { label: "Link Pinterest (Ikon Footer)", name: "pinterest", widget: "string", required: false, hint: "Contoh: https://pinterest.com/username" }

  - name: "settings_collection"
    label: "Pengaturan Website"
    files:
      - label: "Judul & Favicon"
        name: "site_settings"
        file: "src/data/site.json"
        fields:
          - { label: "Judul Website (Site Title)", name: "title", widget: "string", hint: "Judul utama website yang muncul pada tab browser dan footer (contoh: Andrean LP atau Devolio)" }
          - { label: "Tagline / Sub-judul", name: "tagline", widget: "string", required: false, hint: "Slogan yang muncul di samping judul pada tab browser (contoh: Landing Page Strategist)" }
          - { label: "Deskripsi Website (SEO)", name: "description", widget: "string", required: false, hint: "Deskripsi website untuk Google, mesin pencari, dan pratinjau link" }
          - { label: "Favicon (Ikon Tab Browser)", name: "favicon", widget: "image", required: false, hint: "Upload ikon tab browser (.png, .ico, atau .webp). Rekomendasi: gambar persegi (misal 64x64 atau 192x192 px)" }


