backend:
  name: github
  repo: andrean-lp/andrean-lp.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    nested:
      depth: 2
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects_collection"
    label: "Projects"
    files:
      - label: "Daftar Projects"
        name: "all_projects"
        file: "src/pages/projects/projects.json"
        fields:
          - label: "Daftar Proyek"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Demo Link", name: "demoLink", widget: "string", required: false }
              - { label: "Post Link", name: "postLink", widget: "string", required: false }
              - { label: "Tags", name: "tags", widget: "list", required: false }

  - name: "profile_collection"
    label: "Profil & Biodata"
    files:
      - label: "Biodata & Foto Profil"
        name: "profile_data"
        file: "src/data/profile.json"
        fields:
          - { label: "Nama Lengkap", name: "name", widget: "string" }
          - { label: "Headline / Sapaan", name: "headline", widget: "string" }
          - { label: "Role / Profesi", name: "role", widget: "string" }
          - label: "Paragraf Bio"
            name: "bio"
            widget: "list"
            field: { label: "Teks Paragraf", name: "paragraph", widget: "text" }
          - { label: "Foto Profil (Avatar)", name: "avatar", widget: "image", required: false, hint: "Disarankan upload gambar rasio 1:1 (kotak) minimal 600x600 px agar tajam dan proporsional di semua layar HP" }
          - { label: "Link GitHub", name: "github", widget: "string", required: false }
          - { label: "Link Twitter / X", name: "twitter", widget: "string", required: false }
          - { label: "Link Website", name: "website", widget: "string", required: false }

