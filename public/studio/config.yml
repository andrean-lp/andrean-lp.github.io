backend:
  name: github
  repo: andrean-lp/andrean-lp.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    nested:
      depth: 2
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects_collection"
    label: "Projects"
    files:
      - label: "Daftar Projects"
        name: "all_projects"
        file: "src/pages/projects/projects.json"
        fields:
          - label: "Daftar Proyek"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Demo Link", name: "demoLink", widget: "string", required: false }
              - { label: "Post Link", name: "postLink", widget: "string", required: false }
              - { label: "Tags", name: "tags", widget: "list", required: false }
