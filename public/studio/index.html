<!doctype html>
<html lang="en" class="notranslate" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Studio Content Manager</title>
  <link href="./config.yml?v=20260914" type="text/yaml" rel="cms-config-url" />
  <style>
    #token-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      align-items: center;
      justify-content: center;
    }
    #token-modal.active {
      display: flex;
    }
    .token-box {
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
    }
    .token-box h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #0f172a;
    }
    .token-box p {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
      margin: 0 0 12px 0;
    }
    .token-box input {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0 16px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: monospace;
    }
    .token-box button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      transition: background 0.2s;
    }
    .token-box button:hover {
      background: #1d4ed8;
    }
    .token-box a {
      color: #2563eb;
      text-decoration: none;
    }
    .token-box a:hover {
      text-decoration: underline;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="token-modal">
    <div class="token-box">
      <h2>Hubungkan GitHub Token</h2>
      <p>Untuk mengelola postingan dan konten blog Anda, masukkan GitHub Personal Access Token (Classic) dengan izin <code>repo</code>:</p>
      <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      <button onclick="saveToken()">Masuk ke Studio</button>
      <p style="margin-top: 14px; margin-bottom: 0; font-size: 12px; color: #64748b;">
        Belum punya token? <a href="https://github.com/settings/tokens/new?scopes=repo&description=Decap+CMS+Studio" target="_blank">Buat token di GitHub (centang izin 'repo') &raquo;</a>
      </p>
    </div>
  </div>

  <script>
    function saveToken() {
      const input = document.getElementById('pat-input');
      const val = (input.value || '').trim();
      if (!val) {
        alert('Mohon masukkan token GitHub Anda.');
        return;
      }
      localStorage.setItem('decap-cms-user', JSON.stringify({ token: val, backendName: 'github' }));
      document.getElementById('token-modal').classList.remove('active');
      window.location.reload();
    }

    try {
      const user = localStorage.getItem('decap-cms-user');
      if (!user) {
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('token-modal').classList.add('active');
        });
      }
    } catch (e) {
      console.error(e);
    }

    // Deteksi konteks field upload (Avatar, Favicon, Cover Image, atau Umum)
    function getFieldType(input) {
      let el = input;
      for (let i = 0; i < 8 && el; i++) {
        el = el.parentElement;
        if (!el) break;
        const text = (el.innerText || el.textContent || '').toLowerCase();
        if (text.includes('avatar') || text.includes('foto profil') || text.includes('biodata')) {
          return 'avatar';
        }
        if (text.includes('favicon')) {
          return 'favicon';
        }
        if (text.includes('cover') || text.includes('sampul') || text.includes('thumbnail')) {
          return 'cover';
        }
      }
      return 'general';
    }

    // Notifikasi toast saat memproses gambar
    function showToast(msg) {
      let toast = document.getElementById('opt-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'opt-toast';
        toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#18181b;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);z-index:999999;display:flex;align-items:center;gap:10px;font-family:sans-serif;transition:all 0.3s ease;';
        document.body.appendChild(toast);
      }
      toast.innerHTML = '<span style="display:inline-block;animation:spin 1s linear infinite;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></span> ' + msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
      return () => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
      };
    }

    // Smart Auto-Crop, Resize, dan WebP Converter otomatis di browser
    function smartProcessImage(file, fieldType = 'general') {
      return new Promise((resolve) => {
        if (!file.type.startsWith('image/') || file.type === 'image/svg+xml') {
          return resolve(file);
        }

        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const origW = img.naturalWidth || img.width;
          const origH = img.naturalHeight || img.height;

          let canvasW, canvasH, sx = 0, sy = 0, sW = origW, sH = origH;

          if (fieldType === 'avatar') {
            // Auto Center-Crop ke Kotak 1:1, ukuran optimal max 600x600 px (sempurna untuk layar Retina, ~15 KiB)
            const minDim = Math.min(origW, origH);
            sx = Math.round((origW - minDim) / 2);
            sy = Math.round((origH - minDim) / 2);
            sW = minDim;
            sH = minDim;
            const targetDim = Math.min(600, minDim);
            canvasW = targetDim;
            canvasH = targetDim;
          } else if (fieldType === 'favicon') {
            // Auto Center-Crop ke Kotak 1:1, ukuran optimal max 192x192 px (~3 KiB)
            const minDim = Math.min(origW, origH);
            sx = Math.round((origW - minDim) / 2);
            sy = Math.round((origH - minDim) / 2);
            sW = minDim;
            sH = minDim;
            const targetDim = Math.min(192, minDim);
            canvasW = targetDim;
            canvasH = targetDim;
          } else {
            // Gambar Sampul / Blog: Menjaga rasio asli, resize ke max 1200x800 px (~40 KiB)
            const maxW = 1200;
            const maxH = 800;
            let scale = 1;
            if (origW > maxW || origH > maxH) {
              scale = Math.min(maxW / origW, maxH / origH);
            }
            canvasW = Math.round(origW * scale);
            canvasH = Math.round(origH * scale);
          }

          const canvas = document.createElement('canvas');
          canvas.width = canvasW;
          canvas.height = canvasH;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, sx, sy, sW, sH, 0, 0, canvasW, canvasH);

          const quality = fieldType === 'favicon' ? 0.9 : 0.82;
          canvas.toBlob((blob) => {
            if (!blob) return resolve(file);
            const cleanName = file.name.replace(/\.[^/.]+$/, "") + ".webp";
            const webpFile = new File([blob], cleanName, {
              type: 'image/webp',
              lastModified: Date.now()
            });
            resolve(webpFile);
          }, 'image/webp', quality);
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(file);
        };

        img.src = url;
      });
    }

    // Intercept upload file: Auto Crop, Auto Resize, dan Convert ke WebP
    let isProcessing = false;

    window.addEventListener('change', async (e) => {
      const target = e.target;
      if (!target || target.type !== 'file' || !target.files || target.files.length === 0) return;
      if (isProcessing) return;

      const files = Array.from(target.files);
      const hasImage = files.some(f => f.type.startsWith('image/') && f.type !== 'image/svg+xml');
      if (!hasImage) return;

      e.stopImmediatePropagation();
      e.preventDefault();
      isProcessing = true;

      const fieldType = getFieldType(target);
      const hideToast = showToast(
        fieldType === 'avatar' ? 'Memotong kotak & mengoptimalkan foto profil...' :
        fieldType === 'favicon' ? 'Memotong kotak & mengoptimalkan favicon...' :
        'Mengoptimalkan ukuran gambar...'
      );

      try {
        const dt = new DataTransfer();
        for (const file of files) {
          const optimized = await smartProcessImage(file, fieldType);
          dt.items.add(optimized);
        }

        target.files = dt.files;
        target.dispatchEvent(new Event('change', { bubbles: true }));
      } catch (err) {
        console.error('Gagal mengoptimalkan gambar:', err);
      } finally {
        isProcessing = false;
        setTimeout(hideToast, 400);
      }
    }, true);
  </script>
  <!-- Selalu muat config.yml terbaru tanpa terkena cache browser -->
  <script>
    const cfg = document.querySelector('link[rel="cms-config-url"]');
    if (cfg) {
      cfg.setAttribute('href', './config.yml?t=' + Date.now());
    }
  </script>
  <!-- Menggunakan decap-cms versi 3.0.12 yang stabil tanpa bug React removeChild -->
  <script src="https://unpkg.com/decap-cms@3.0.12/dist/decap-cms.js"></script>
</body>
</html>
